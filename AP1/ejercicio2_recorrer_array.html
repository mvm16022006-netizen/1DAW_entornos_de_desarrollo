<body>
  <h1>AP1 - Ejercicio 2: Recorrer array</h1>
  <p>Abre la consola del navegador (F12 &rarr; pestaña <strong>Consola</strong>) y recarga la página (F5) para ver el resultado.</p>
  <p>Para depurar, usa la pestaña <strong>Depurador / Sources</strong>.</p>

<script>
// ============================================================
// EJERCICIO 2: Recorrer un array
// Objetivo: calcular suma, máximo y media de una lista de números.
//
// RESULTADO ESPERADO:
//   Suma: 15
//   Máximo: 9
//   Media: 3
//   Máximo con negativos: -2
//
// TAREA: encuentra y corrige los errores. Usa console.log,
// puntos de interrupción (breakpoints) y el panel "Watch"
// de las DevTools para seguir el valor de las variables.
// ============================================================
/*
  ERRORES ENCONTRADOS (líneas del fichero original)

  Error 1 - Línea 29 - Tipo: LÓGICA
  Qué pasaba: total empezaba como texto (let total = "";). Al hacer += con un
  texto, JavaScript no suma sino que concatena, por eso salía "-2913undefined".
  Cómo lo corregí: inicializo total como número: let total = 0;

  Error 2 - Línea 30 - Tipo: LÓGICA
  Qué pasaba: el bucle era for (let i = 1; i <= array.length; i++).
  - Empezaba en 1, así que se saltaba el primer elemento (el 4).
  - Con <= daba una vuelta de más y leía array[5], que no existe (undefined).
  Cómo lo corregí: for (let i = 0; i < array.length; i++)

  Error 3 - Línea 37 - Tipo: LÓGICA
  Qué pasaba: max empezaba en 0, un valor que no está en el array. Con
  [-5, -2, -9] ningún número es mayor que 0, así que devolvía 0 en vez de -2.
  Cómo lo corregí: max empieza con el primer elemento del array: let max = array[0];

  Error 4 - Línea 47 - Tipo: EJECUCIÓN
  Qué pasaba: array.length() lanzaba "TypeError: array.length is not a function"
  y paraba el programa, por lo que no se mostraban ni la media ni el máximo con negativos.
  length es una propiedad, no una función, así que no lleva paréntesis.
  Cómo lo corregí: array.length
*/

function sumar(array) {
  let total = 0; // let total = "";
  for (let i = 0  ; i < array.length; i++) {
  
    total += array[i];
  }
  return total;
}

function maximo(array) {
  let max = array[0];
  for (let i = 0; i < array.length; i++) {
    if (array[i] > max) {
      max = array[i];
    }
  }
  return max;
}

function media(array) {
  return sumar(array) / array.length; 
}

let numeros = [4, -2, 9, 1, 3];

console.log("Suma:", sumar(numeros));
console.log("Máximo:", maximo(numeros));
console.log("Media:", media(numeros));
console.log("Máximo con negativos:", maximo([-5, -2, -9]));
</script>
</body>
</html>
